<html>
	<head>
		<title>Login/Register</title>
		<link rel = 'stylesheet' type = 'text/css' href = '../styles/style.css'>
		<link rel = 'stylesheet' type = 'text/css' href = '../styles/login.css'>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<script type = 'text/javascript' src = '../jQuery.js'></script>
	</head>
	<body>
		<header>
			<nav>
				<img src = '../icons/menu.png' alt = 'Home' class = 'menu_but'>
				<ul class = 'nav_list'>
					<li><a href = '../' class = 'buttons'>Home</a></li>
					<li><a href = '../info/' class = 'buttons'>Info</a></li>
				</ul>
			</nav>
			<h3 class = 'head_name'>MCLAREN 720S GT3 EVO</h3>
			<a href = 'https://www.mclaren.com' target = '_blank'><img src = '../src/logo.jpg' class = 'logo'></a>
		</header>
		
		<div class = 'login-page'>
			<form class = 'login-form' action = '../' method = 'POST'>
				<h3>Увійти</h3>
				
				<div class = 'input'>
				<label for = 'email'>Електронна пошта</label>
				<input type = 'email' id = 'email' name = 'email' required>
				</div>
				
				<div class = 'input'>
				<label for = 'password'>Пароль</label>
				<input type = 'password' id = 'password' name = 'password' required>
				</div>
				
				<button type = 'submit' class = 'submit-btn'>Увійти</button>
				<p class = 'register_link'>Ще не зареєстровані? <a href =  'register/index.html'>Зареєструйтесь зараз!</a></p>
			</form>
		</div>
		
		<footer>
			<a class = 'contact_but' href = '../contacts/'>Contacts</a>
		</footer>

		<script>
			$(document).ready(function() {
				$('.nav_list').hide();
				let nav_open = 0;
				$('.menu_but').click(function() {
					$('.nav_list').toggle(500);
				});
			})
		</script>

	</body>
</html>
