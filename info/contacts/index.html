<html>
	<head>
		<title>MCLAREN 720S GT3 EVO</title>
		<link rel = 'stylesheet' type = 'text/css' href = '../../styles/style.css'>
		<link rel = 'stylesheet' type = 'text/css' href = '../../styles/contacts.css'>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<script type = 'text/javascript' src = '../../jQuery.js'></script>
		<script type = 'text/javascript' src = '../../script.js'></script>
	</head>
	<body>
		<header>
			<nav>
				<img src = '../../icons/menu.png' alt = 'Home' class = 'menu_but'>

			</nav>
			<h3 class = 'head_name'>MCLAREN 720S GT3 EVO</h3>
			<a href = 'https://www.mclaren.com' target = '_blank'><img src = '../../src/logo.png' class = 'logo'></a>
		</header>

		<div class = 'down_menu'>
			<ul class = 'nav_list'>
					<li><a href = '../' class = 'buttons'>Info</a></li>
					<li><a href = '../../login/' class = 'buttons'>Login</a></li>
					<li><a href = '../../catalog/' class = 'buttons'>Catalog</a></li>
			</ul>
		</div>
		
		<div class = 'feedback'>
			<form class = 'login-form'action = '../../index.html' method = 'GET'>
				<h2>Зворотній зв'язок</h2>
				<h4>Як з вами зв'язатись?</h4>
				
				<div class = 'check-box'>
					<div class = 'check_first'>
						<input type = 'radio' id = 'email_check' name = 'email_checkbox'>
						<label class = 'check_label'>Електронна адреса</label>
					</div>
					
					<div class = 'check_second'>
						<input type = 'radio' id = 'phone_number' name = 'phone_number'>
					<label class = 'check_label'>Номер телефону</label>
					</div>
				</div>
				<div class = 'input'>
					<label>Електронна адреса</label>
					<input type = 'email' id = 'email'>
				</div>
				<div class = 'input'>
					<label>Номер телефону</label>
					<input type = 'phone' id = 'phone_input'>
				</div>
				<button type = 'submit' id = 'submit-but' class = 'buttons'>Відправити</button>
			</form> 
		</div>
		<footer>
			<a class = 'buttons' href = '../contacts/'>Contacts</a>
			<label class="theme-switch">
				<input type="checkbox" id="theme-checkbox">
				<div class="slider-track">
					<svg class="icon-moon" viewBox="0 0 24 24">
						<path fill="#f1c40f" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
					</svg>
					<svg class="icon-sun" viewBox="0 0 24 24">
						<circle cx="12" cy="12" r="5" fill="#f39c12"></circle>
						<path fill="#f39c12" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
					</svg>
					<div class="slider-knob"></div>
				</div>
			</label>
		</footer>
	</body>
</html>
